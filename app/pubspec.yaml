name: barkath_app
description: "Barkath — customer app (perfumes, books, clothing, Islamic). India-only, INR."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State + routing (spec §0.1)
  provider: ^6.1.2
  go_router: ^14.6.2

  # Design system
  google_fonts: ^6.2.1

  # Firebase — same project as admin/web (barkath-25607)
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1
  firebase_storage: ^12.3.7
  cloud_functions: ^5.1.5
  # Push: registers this device in `fcmTokens`, which is the collection the
  # adminSendBroadcastNotification fan-out multicasts to.
  firebase_messaging: ^15.2.10

  # Payments — Razorpay native checkout (test + live). Key id comes from the
  # createRazorpayOrder Cloud Function at runtime; the secret lives only in
  # Secret Manager (never in the app).
  razorpay_flutter: ^1.3.7

  # Local storage + formatting
  shared_preferences: ^2.3.3
  intl: ^0.20.1

  # Launch tel: / mailto: / wa.me links from the Help centre.
  url_launcher: ^6.3.0

  # Share sheet (product + invoice) and avatar image picking.
  share_plus: ^10.1.2
  image_picker: ^1.1.2
  flutter_local_notifications: ^22.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/brand/
    - assets/images/onboarding/
